name: Build Edith IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Edith.xcodeproj \
            -scheme Edith

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Edith.xcodeproj \
            -scheme Edith \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Edith.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Edith-unsigned.ipa Payload
          ls -la Edith-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Edith-unsigned-ipa
          path: Edith-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # Derleme kırılırsa hata satırlarını ci-logs dalına yazar; oradan giriş yapmadan okunabilir.
      - name: Publish build errors to ci-logs branch
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/cilogs
          grep -E "error:" build.log | sed -E 's#/Users/runner/work/edith/edith/##g' | sort -u > /tmp/cilogs/errors.txt
          cp build.log /tmp/cilogs/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-logs
          git rm -rfq --cached . >/dev/null 2>&1
          rm -rf ./* .github .gitignore
          cp /tmp/cilogs/errors.txt /tmp/cilogs/build.log .
          git add errors.txt build.log
          git commit -q -m "build errors $(date -u +%FT%TZ)"
          git push -f origin ci-logs
