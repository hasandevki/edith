name: Edith

options:
  bundleIdPrefix: com.hasan
  deploymentTarget:
    iOS: "17.2"
  developmentLanguage: tr
  createIntermediateGroups: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0

targets:
  Edith:
    type: application
    platform: iOS
    sources:
      - path: Edith/Sources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasan.edith
        PRODUCT_NAME: Edith
        INFOPLIST_FILE: Edith/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Edith/Edith.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        ENABLE_PREVIEWS: "NO"
